<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I217E 関数プログラミング · 互动学习系统</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/learn.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">I217E</div>
      <div class="brandtext">
        <b>関数プログラミング</b>
        <span>CafeOBJ 互动学习系统</span>
      </div>
    </div>

    <div class="progress-box">
      <div class="pb-label"><span>总体进度</span><span id="pb-pct">0%</span></div>
      <div class="pb-outer"><div class="pb-inner" id="pb-bar"></div></div>
      <div class="pb-sub" id="pb-sub">0 / 0 个知识点</div>
    </div>

    <div class="countdown" id="countdown">
      <div class="cd-num" id="cd-days">--</div>
      <div class="cd-text">天后期末考试<br><small id="cd-date">2026-12-01 10:50</small></div>
    </div>

    <nav id="nav"></nav>

    <div class="side-foot">
      <button class="mini-btn" id="btn-reset">重置全部进度</button>
      <div class="hint">进度自动保存在本机浏览器</div>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <button class="mini-btn" id="btn-search" title="搜索全部课文（快捷键 Ctrl+K）">🔍 搜索</button>
        <button class="mini-btn" id="btn-gloss" title="所有术语的大白话解释">📘 术语表</button>
        <button class="mini-btn" id="btn-prev">← 上一节</button>
        <button class="mini-btn" id="btn-next">下一节 →</button>
        <button class="mini-btn" id="btn-review">复习队列 <span id="review-count">0</span></button>
      </div>
    </header>
    <div id="view"></div>
    <footer id="footer">
      <span>本地离线运行 · 引擎为简化版 CafeOBJ 解释器，用于学习演示 · 带虚线下划线的词，鼠标停上去可看解释</span>
    </footer>
  </main>
</div>

<div id="modal-back" class="modal-back hidden">
  <div class="modal" id="modal">
    <div class="modal-head"><span id="modal-title">随堂小测</span><button id="modal-close">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/engine.js"></script>
<script src="js/glossary.js"></script>
<script src="js/widgets.js"></script>
<script src="js/mounts.js"></script>
<script src="js/quiz.js"></script>
<script src="js/learn.js"></script>
<script src="js/pre-labs.js"></script>
<script src="js/pre-labs2.js"></script>
<script src="js/content-pre.js"></script>
<script src="js/content-core.js"></script>
<script src="js/content-mid.js"></script>
<script src="js/content-adv.js"></script>
<script src="js/homework.js"></script>
<script src="js/app.js"></script>
</body>
</html>
